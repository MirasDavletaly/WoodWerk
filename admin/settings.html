<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'self'">
<meta name="robots" content="noindex, nofollow">
<title>Настройки — админ-панель WOODWERK</title>
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body data-page="settings">

<div class="sidebar-backdrop"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar__head">
      <img src="/assets/img/logo.svg" alt="" width="34" height="34">
      <span class="sidebar__title">Woodwerk<span class="sidebar__sub">панель управления</span></span>
    </div>

    <nav class="sidebar__nav">
      <a class="sidebar__link" href="/admin/dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Главная
      </a>
      <a class="sidebar__link" href="/admin/products">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>
        Мебель
      </a>
      <a class="sidebar__link" href="/admin/products/new">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
        Добавить мебель
      </a>
      <a class="sidebar__link" href="/admin/categories">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Категории
      </a>
      <a class="sidebar__link is-active" href="/admin/settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
        Настройки
      </a>
      <a class="sidebar__link" href="/" target="_blank" rel="noopener noreferrer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        Открыть сайт
      </a>
    </nav>

    <div class="sidebar__foot">
      <div class="sidebar__user">Вы вошли как<b data-user-name>…</b></div>
      <button class="btn btn--sidebar" type="button" data-logout>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/><path d="M16 15l4-3-4-3"/><path d="M20 12H10"/></svg>
        Выйти
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger-admin" type="button" data-sidebar-toggle aria-label="Меню">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <span class="topbar__crumb">Админ-панель</span>
        <h1>Настройки</h1>
      </div>
      <div class="topbar__spacer"></div>
    </header>

    <main class="content">
      <div class="content--narrow">
        <section class="card">
          <div class="card__head"><h2>Учётная запись</h2></div>
          <div class="card__body">
            <div class="field-row">
              <div class="field">
                <span class="field__label">Логин</span>
                <p data-login-value>…</p>
              </div>
              <div class="field">
                <span class="field__label">Создана</span>
                <p data-created-value>…</p>
              </div>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="card__head"><h2>Смена пароля</h2></div>
          <div class="card__body">
            <form data-password-form novalidate>
              <p class="form-error" data-form-error role="alert"></p>

              <div class="field">
                <label for="s-current">Текущий пароль</label>
                <input id="s-current" type="password" autocomplete="current-password" maxlength="200">
              </div>
              <div class="field-row">
                <div class="field">
                  <label for="s-next">Новый пароль</label>
                  <input id="s-next" type="password" autocomplete="new-password" maxlength="200">
                  <span class="field__hint">Не короче 8 символов.</span>
                </div>
                <div class="field">
                  <label for="s-repeat">Повторите новый пароль</label>
                  <input id="s-repeat" type="password" autocomplete="new-password" maxlength="200">
                </div>
              </div>

              <button class="btn btn--primary" type="submit">Сохранить</button>
              <p class="field__hint">После смены пароля все остальные сеансы будут закрыты.</p>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/admin.js"></script>
</body>
</html>
