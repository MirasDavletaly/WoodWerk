# nginx для WOODWERK.
#
# Положить в /etc/nginx/sites-available/woodwerk и сделать ссылку
# в sites-enabled. Домен и пути к сертификату заменить на свои.
#
# Сертификат проще всего получить через certbot:
#     sudo certbot --nginx -d wooodwerk.com -d www.wooodwerk.com
# certbot сам допишет строки ssl_certificate в этот файл.

# --- ограничение частоты обращений к панели и формам ---
# Подбор пароля сервер тормозит и сам, но лучше отсечь поток раньше.
limit_req_zone $binary_remote_addr zone=woodwerk_admin:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=woodwerk_forms:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wooodwerk.com www.wooodwerk.com;

    # Всё, кроме проверки сертификата, уводим на HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/woodwerk;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wooodwerk.com www.wooodwerk.com;

    ssl_certificate     /etc/letsencrypt/live/wooodwerk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wooodwerk.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Фотографии мебели весят мегабайты — иначе загрузка упрётся в лимит nginx.
    client_max_body_size 20m;

    # Сжатие делает сам Go-сервер, здесь дублировать не нужно.
    gzip off;

    access_log /var/log/nginx/woodwerk.access.log;
    error_log  /var/log/nginx/woodwerk.error.log;

    # --- вход в панель: жёстче лимит ---
    location = /api/admin/login {
        limit_req zone=woodwerk_admin burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- заявки с форм ---
    location = /api/lead {
        limit_req zone=woodwerk_forms burst=5 nodelay;
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- всё остальное ---
    location / {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Загрузка фотографий бывает долгой.
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # Ответ отдаём как есть: сервер уже сжал его сам.
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }
}
