  <g fill="#EFE9E1" opacity=".8"><rect x="396" y="512" width="72" height="6" rx="3"/><rect x="534" y="512" width="72" height="6" rx="3"/></g>
  <rect x="290" y="432" width="420" height="18" rx="4" fill="#EFE9E1"/>
  <g stroke="#3A2C22" stroke-width="8" stroke-linecap="round"><path d="M318 596v34M682 596v34"/></g>

  <!-- раковина и смеситель -->
  <path d="M420 432a80 34 0 0 1 160 0z" fill="#FBF9F5"/>
